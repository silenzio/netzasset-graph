services:
  neo4j:
    image: neo4j:5.26-community
    container_name: netzasset-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-netzasset-demo}
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-netzasset-demo} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  pipeline:
    build: .
    container_name: netzasset-pipeline
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-netzasset-demo}
      REGION: ${REGION:-DE-NW}
      VOLTAGES_KV: ${VOLTAGES_KV:-220,380}
      MATCH_TOLERANCE_M: ${MATCH_TOLERANCE_M:-250}
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "pipeline.run"]

volumes:
  neo4j-data:
